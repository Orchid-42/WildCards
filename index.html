<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>WildCards</title>
<meta name="theme-color" content="#0c0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="WildCards">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>html,body{margin:0;background:#0c0d10;-webkit-text-size-adjust:100%}body{padding-top:env(safe-area-inset-top,0px)}#app{height:calc(100dvh - env(safe-area-inset-top,0px))!important}.nav button[data-tab="art"]{display:none}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500&display=swap">
<style>
/* Layout: a quiet graphite table. The UI stays neutral so the cards carry all the color; amber marks power, blue marks energy. */
:root{
  color-scheme:dark;
  --bg:#0c0d10; --bg2:#111216; --surf:#16171b; --surf2:#1f2126; --surf3:#2a2c33; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
  --text:#f4f4f5; --muted:#9a9ba3; --dim:#6b6d76; --amber:#ffb547; --amber2:#ffd892; --energy:#4aa8ff; --coral:#ff6b5b; --mint:#3ddc97;
  --f:'Geist', ui-sans-serif, system-ui, sans-serif; --mono:'Geist Mono', ui-monospace, monospace;
  --ease:cubic-bezier(.2,.85,.25,1); --r:16px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,label:focus-within{outline:2px solid var(--amber2);outline-offset:2px}
img{user-select:none;-webkit-user-drag:none}
.cardbox,.zcard,.tc,.pc,.cell,.exp,.pouch,#battle{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{min-height:100%;display:flex;flex-direction:column}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(12,13,16,.82);backdrop-filter:blur(16px) saturate(1.4)}
.mark{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.02em}
.mark i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--amber),#e8742f);display:grid;place-items:center;color:#1a1004}
.mark i svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.wallet{display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;background:var(--surf);padding:6px 11px 6px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
.coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe7a8,var(--amber) 55%,#a8661c);flex:none}
.clv{width:12px;height:12px;border-radius:3px;background:var(--energy);flex:none;transform:rotate(45deg)}
main{flex:1;width:100%;max-width:1400px;margin:0 auto;padding-block:8px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:2px;padding:5px;background:rgba(22,23,27,.9);backdrop-filter:blur(16px);border:1px solid var(--line2);border-radius:22px;box-shadow:0 18px 40px rgba(0,0,0,.5);width:min(460px,calc(100% - 32px))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;border-radius:17px;font-size:10.5px;font-weight:600;color:var(--dim);transition:background .25s,color .25s}
.nav button[aria-current="true"]{background:var(--surf3);color:var(--text)}
.nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.025em;text-wrap:balance}
h1{font-size:28px;line-height:1.1}
h2{font-size:17px;letter-spacing:-.015em}
h3{font-size:15px}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);max-width:58ch;margin:8px 0 0}
.stack{display:flex;flex-direction:column;gap:24px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.small{font-size:12.5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;font-weight:600;background:var(--text);color:var(--bg);transition:transform .15s,opacity .2s,background .2s}
.btn:active{transform:scale(.97)}
.btn.amber{background:var(--amber);color:#1a1004}
.btn.ghost{background:var(--surf2);color:var(--text)}
.btn.sm{height:36px;padding:0 13px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.35;pointer-events:none}
.seg{display:flex;gap:2px;padding:3px;background:var(--surf);border-radius:12px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:none;padding:7px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surf3);color:var(--text)}
.card-s{background:var(--surf);border-radius:var(--r);padding:16px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:95;box-shadow:0 12px 30px rgba(0,0,0,.45);max-width:calc(100% - 32px);text-align:center;animation:toastIn .3s var(--ease)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}}

/* progress */
.lvl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center}
.lvl .num{grid-row:span 2;width:58px;height:58px;border-radius:16px;background:var(--surf2);display:grid;place-items:center;font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--surf3);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--energy),var(--amber));border-radius:99px;transition:width .6s var(--ease)}
.tiers{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:14px}
.tiers div{padding:8px 4px;border-radius:10px;background:var(--bg2);text-align:center;font-size:10.5px;color:var(--dim)}
.tiers b{display:block;font-size:14px;color:var(--muted);margin-bottom:1px}
.tiers .on{background:var(--surf2);color:var(--muted)}
.tiers .on b{color:var(--amber2)}

/* expeditions */
.exps{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.exp{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;text-align:left;padding:10px 14px 10px 10px;background:var(--surf);border-radius:var(--r);transition:transform .2s var(--ease),background .2s}
.exp:active{transform:scale(.985)}
.exp img{width:64px;height:64px;border-radius:12px;object-fit:cover;object-position:50% 62%}
.exp h3{font-size:15px}
.exp p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.exp .st{font-size:12px;font-weight:600;color:var(--muted)}
.exp.done .st{color:var(--mint)}
.exp.locked{opacity:.4}
.exp.locked img{filter:grayscale(1)}

/* ===== card ===== */
.cardbox{container-type:inline-size;position:relative;width:100%;aspect-ratio:5/7}
.card{position:absolute;inset:0;border-radius:7cqw;background:#0b0c0f;box-shadow:0 1.5cqw 4cqw rgba(0,0,0,.45);isolation:isolate}
.art{position:absolute;inset:3.2cqw;border-radius:4.6cqw;overflow:hidden;background:#1a1c21}
.bgw{position:absolute;left:-3.2cqw;top:-3.2cqw;width:100cqw;height:140cqw;}
.bl .bgw,.bl .fgi{left:-13.2cqw;top:-13.2cqw;width:120cqw;height:160cqw}
.bgw{transform:translate(calc(var(--tx,0)*-2.6%),calc(var(--ty,0)*-1.9%))}
.bgw img{width:100%;height:100%;object-fit:cover;display:block}
.frame{position:absolute;inset:0;border-radius:7cqw;padding:3.2cqw;overflow:hidden;background:linear-gradient(160deg,var(--b2,#8d9199),var(--b1,#5d6169) 42%,var(--b3,#43464d) 70%,var(--b1,#6b6f77));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;z-index:2}
.frame::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 .4cqw rgba(255,255,255,.18)}
.f1 .frame{background:linear-gradient(135deg,#f7f9fb,#aeb5bf 22%,#f1f4f7 42%,#8b929c 66%,#e6eaef 86%,#b9c0c9)}
.f2 .frame{background:linear-gradient(135deg,#fff3c4,#d7a640 22%,#fff1b9 42%,#a6741c 66%,#f6da86 86%,#c99434)}
.f1 .frame::after,.f2 .frame::after{box-shadow:inset .45cqw .45cqw .5cqw rgba(255,255,255,.85),inset -.45cqw -.45cqw .6cqw rgba(0,0,0,.42),inset 0 0 0 .2cqw rgba(255,255,255,.35)}
.f1 .art::before,.f2 .art::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:1;pointer-events:none;box-shadow:inset .5cqw .5cqw .7cqw rgba(0,0,0,.5),inset -.35cqw -.35cqw .4cqw rgba(255,255,255,.45)}
.f3 .frame{background:conic-gradient(from var(--hue,0deg),#ff7ab6,#ffd36b,#7dffb0,#6bd3ff,#b28bff,#ff7ab6);animation:hue 4.5s linear infinite}
/* Plasma: two counter-rotating energy fields inside the ring, with a flickering hot edge */
.f4 .frame{background:radial-gradient(circle,#0d0820,#04020b)}
.f4 .frame .pl{position:absolute;left:50%;top:50%;width:200cqw;height:200cqw;margin:-100cqw 0 0 -100cqw;background:conic-gradient(from 0deg,transparent 0deg,var(--p1,#7a5cff) 35deg,transparent 75deg,var(--p2,#3de8ff) 140deg,transparent 190deg,var(--p3,#ff4fd8) 250deg,transparent 300deg,var(--p1,#7a5cff) 335deg,transparent 360deg);filter:blur(2.2cqw) saturate(1.4);mix-blend-mode:screen;animation:spin 14s linear infinite}
.f4 .frame .pl.b{background:conic-gradient(from 60deg,transparent 0deg,#ffffff 20deg,transparent 45deg,var(--p2,#3de8ff) 120deg,transparent 170deg,var(--p1,#7a5cff) 230deg,transparent 280deg,var(--p3,#ff4fd8) 320deg,transparent 360deg);animation-duration:20s;animation-direction:reverse;opacity:.85;filter:blur(1.6cqw)}
.f4 .frame .pl.c{background:repeating-conic-gradient(from 0deg,transparent 0 7deg,rgba(255,255,255,.55) 8deg,transparent 9deg 19deg);filter:blur(.6cqw);animation-duration:34s;opacity:.4}
.f4 .frame::after{box-shadow:inset 0 0 0 .35cqw rgba(255,255,255,.7),inset 0 0 1.8cqw var(--p2,#3de8ff)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flick{0%,100%{opacity:1}45%{opacity:.65}50%{opacity:1}55%{opacity:.8}}
@property --hue{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes hue{to{--hue:360deg}}
@keyframes flow{to{background-position:300% 0}}
/* glows around the card, per border */
.card::before{content:"";position:absolute;inset:-1.6cqw;border-radius:8.6cqw;z-index:-1;pointer-events:none;opacity:0}
.f1.card::before{opacity:1;background:rgba(232,240,250,.6);filter:blur(3.4cqw)}
.f2.card::before{opacity:1;background:rgba(255,196,80,.75);filter:blur(3.8cqw)}
.f3.card::before{opacity:.95;background:conic-gradient(from var(--hue,0deg),#ff7ab6,#ffd36b,#7dffb0,#6bd3ff,#b28bff,#ff7ab6);filter:blur(4.6cqw);animation:hue 4.5s linear infinite}
.f5 .frame{background:#06070b}
.f5 .frame::before{content:"";position:absolute;inset:1.05cqw;border-radius:5.9cqw;border:.55cqw solid var(--neC,#f2fdff);box-shadow:0 0 .6cqw var(--ne,#3de8ff),0 0 1.6cqw var(--ne,#3de8ff),inset 0 0 .6cqw var(--ne,#3de8ff),inset 0 0 1.4cqw var(--ne,#3de8ff)}
.f5 .frame::after{box-shadow:inset 0 0 0 .3cqw rgba(255,255,255,.08)}
.f5.card::before{opacity:1;inset:-2.6cqw;border-radius:9.6cqw;background:var(--ne,#3de8ff);filter:blur(5.6cqw)}
.f5 .art::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:1;pointer-events:none;box-shadow:inset 0 0 3cqw color-mix(in srgb,var(--ne,#3de8ff) 55%,transparent)}
.f4.card::before{opacity:.9;background:radial-gradient(circle at 30% 20%,var(--p2,#3de8ff),transparent 60%),radial-gradient(circle at 70% 80%,var(--p3,#ff4fd8),transparent 60%),var(--p1,#7a5cff);filter:blur(4.4cqw)}
@keyframes pulse{50%{opacity:.6;transform:scale(1.03)}}
/* border colours (Graphite, Aurora and Plasma) */
.bc-crimson{--ne:#ff3b5c;--k1:#ff2a4a;--k2:#ff8a5c;--k3:#ffe0d0;--b1:#d93a52;--b2:#ff9aa9;--b3:#5e0d1d;--a4:#ffc2a8;--p1:#ff3355;--p2:#ffb199;--p3:#ff2fb3}
.bc-cobalt{--ne:#3d7bff;--k1:#2a5cff;--k2:#3de8ff;--k3:#e0f7ff;--b1:#3577f0;--b2:#9cc2ff;--b3:#0f245c;--a4:#7ff0ff;--p1:#2f6bff;--p2:#5ff0ff;--p3:#9a7bff}
.bc-jade{--ne:#22f59a;--k1:#14c47a;--k2:#c8ff3d;--k3:#f0ffe0;--b1:#22b57c;--b2:#9df0cc;--b3:#0b3f2b;--a4:#e4ff8a;--p1:#19e08f;--p2:#b6ff5c;--p3:#3de8ff}
.bc-violet{--ne:#a86bff;--k1:#8a3dff;--k2:#ff5cd6;--k3:#ffe0fa;--b1:#8a55f0;--b2:#d2b8ff;--b3:#2b1060;--a4:#ff9ee6;--p1:#9b5cff;--p2:#ff7ae0;--p3:#5c8bff}
.bc-ember{--ne:#ff8a2a;--k1:#ff4a1a;--k2:#ffd21a;--k3:#fff6c0;--b1:#f07a22;--b2:#ffd09e;--b3:#5e2306;--a4:#ffe066;--p1:#ff7a1a;--p2:#ffd23d;--p3:#ff3d3d}
.bc-pink{--ne:#ff4fd2;--b1:#ff5fbf;--b2:#ffc2e8;--b3:#6a0f45;--a4:#ffd1f0;--p1:#ff4fd2;--p2:#ffb3ec;--p3:#b45cff}
.bc-yellow{--ne:#ffe23d;--neC:#fffbe0;--b1:#f2c81d;--b2:#fff0a3;--b3:#5c4703;--a4:#fff7cc;--p1:#ffd21a;--p2:#fff47a;--p3:#ff9a1a}
.bc-onyx{--ne:#e8ecf2;--k1:#9aa1ad;--k2:#f1f3f6;--k3:#ffffff;--b1:#2a2c33;--b2:#5c606a;--b3:#0b0c0f;--a4:#9aa1ad;--p1:#e8ecf2;--p2:#9aa6b8;--p3:#ffffff}
/* animal layer */
.fgw{position:absolute;inset:3.2cqw;border-radius:4.6cqw;overflow:hidden;z-index:2;pointer-events:none}
.fgi{position:absolute;left:-3.2cqw;top:-3.2cqw;width:100cqw;height:140cqw;transform:translate(calc(var(--tx,0)*2.6%),calc(var(--ty,0)*1.9%))}
.fgi img{position:absolute;inset:0;width:100%;height:100%;display:block}
.f2 .fgw,.f3 .fgw,.f4 .fgw,.f5 .fgw{overflow:visible}
.f2 .fgi,.f3 .fgi,.f4 .fgi,.f5 .fgi{transform:translate(calc(var(--tx,0)*6%),calc(var(--ty,0)*4.5% - 3%)) scale(1.08)}
.f2 .fgi img,.f3 .fgi img,.f4 .fgi img,.f5 .fgi img{filter:drop-shadow(0 1cqw 1.4cqw rgba(0,0,0,.22))}

@keyframes kb{to{transform:scale(1.08) translateY(-2%)}}
/* Flat art: the picture never moves inside the card. Depth comes from the frame, badges and text sitting on top, and from the finish catching the light */
.bgw,.fgi{transform:none!important}
.fgw{overflow:hidden!important;z-index:1!important}
.fgi img{filter:none!important}
/* Graphite (standard) is a flat print: no depth between scene and animal until the first upgrade */
.f0 .bgw,.f0 .fgi{transform:none!important}
.fx{position:absolute;inset:-30%;pointer-events:none;background-image:radial-gradient(circle,var(--pc) 0 1.4px,transparent 2px),radial-gradient(circle,var(--pc) 0 1px,transparent 1.6px);background-size:46px 46px,29px 29px;background-position:0 0,13px 17px;opacity:.75;animation:drift 12s linear infinite;mix-blend-mode:screen}
.fx-TUN,.fx-SAV,.fx-DES{--pc:rgba(255,255,255,.9)}
.fx-OCN{--pc:rgba(200,240,255,.8);animation-direction:reverse}
.fx-RAIN,.fx-FOR,.fx-WET{--pc:rgba(255,226,120,.95);animation-duration:18s}
@keyframes drift{to{transform:translate(-46px,46px)}}
.fx-TUN,.fx-SAV,.fx-DES{--pc:rgba(255,255,255,.9)}
.fx-OCN{--pc:rgba(200,240,255,.8);animation-direction:reverse}
.fx-RAIN,.fx-FOR,.fx-WET{--pc:rgba(255,226,120,.95);animation-duration:18s}

/* ===== finishes: the scene gets one material, the animal another ===== */
.fin{position:absolute;inset:3.2cqw;border-radius:4.6cqw;z-index:2;pointer-events:none;overflow:hidden}
.finfg{position:absolute;inset:0;pointer-events:none;-webkit-mask:var(--fgm) 0 0/100% 100% no-repeat;mask:var(--fgm) 0 0/100% 100% no-repeat}
.lightband{-webkit-mask:linear-gradient(112deg,transparent 15%,#000 40%,#000 60%,transparent 85%) calc(50% - var(--tx,0)*60%) calc(50% - var(--ty,0)*40%)/260% 260% no-repeat;mask:linear-gradient(112deg,transparent 15%,#000 40%,#000 60%,transparent 85%) calc(50% - var(--tx,0)*60%) calc(50% - var(--ty,0)*40%)/260% 260% no-repeat}
/* Foil — scene: fine diffraction lines over brushed metal, colours slide as you tilt */
.fn-foil .fin{background:repeating-linear-gradient(90deg,rgba(255,255,255,.09) 0 .18cqw,transparent .18cqw .5cqw),linear-gradient(115deg,#ff9ab8,#ffd08a,#fff59a,#a6ffc6,#8fe3ff,#b3a3ff,#ff9be6,#ff9ab8,#ffd08a,#fff59a,#a6ffc6,#8fe3ff,#b3a3ff,#ff9be6,#ff9ab8);background-size:100% 100%,220% 220%;background-repeat:repeat,no-repeat;background-position:0 0,calc(50% + var(--tx,0)*48%) calc(50% + var(--ty,0)*40%);mix-blend-mode:overlay;opacity:calc(.62 + var(--tm,0)*.3)}
@supports (background:linear-gradient(in oklch,red,blue)){.fn-foil .fin{background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.09) 0 .18cqw,transparent .18cqw .5cqw),linear-gradient(115deg in oklch longer hue,oklch(.84 .13 0),oklch(.84 .13 0) 50%,oklch(.84 .13 0))}}
.fn-foil .fin::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,#ff9ab8,#ffd08a,#fff59a,#a6ffc6,#8fe3ff,#b3a3ff,#ff9be6,#ff9ab8,#ffd08a,#fff59a,#a6ffc6,#8fe3ff);background-size:240% 240%;background-repeat:no-repeat;background-position:calc(50% + var(--tx,0)*55%) calc(50% + var(--ty,0)*45%);mix-blend-mode:color-dodge;opacity:calc(.32 + var(--tm,0)*.35);
  -webkit-mask:linear-gradient(112deg,transparent 20%,#000 42%,#000 58%,transparent 80%) calc(50% - var(--tx,0)*30%) calc(50% - var(--ty,0)*22%)/260% 260% no-repeat;mask:linear-gradient(112deg,transparent 20%,#000 42%,#000 58%,transparent 80%) calc(50% - var(--tx,0)*30%) calc(50% - var(--ty,0)*22%)/260% 260% no-repeat}
/* Foil reflection: a sharp glint, a wide soft sheen and faint sky/ground bands that slide the other way */
.fn-foil .art::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(112deg,transparent 45%,rgba(255,255,255,.26) 50%,transparent 55%),linear-gradient(112deg,transparent 30%,rgba(255,255,255,.1) 50%,transparent 70%),linear-gradient(180deg,rgba(255,255,255,.08),transparent 22%,transparent 66%,rgba(255,255,255,.06) 86%,transparent);
  background-size:300% 300%,260% 260%,100% 260%;background-repeat:no-repeat;
  background-position:calc(50% - var(--tx,0)*26%) calc(50% - var(--ty,0)*18%),calc(50% - var(--tx,0)*30%) calc(50% - var(--ty,0)*22%),0 calc(50% - var(--ty,0)*45% - var(--tx,0)*12%);
  mix-blend-mode:screen;opacity:calc(.55 + var(--tm,0)*.45)}
/* Foil — animal: sparkle glitter, moves the other way */

.turn{font-weight:600;font-size:12px;padding:6px 11px;border-radius:999px;background:var(--surf2);white-space:nowrap;font-variant-numeric:tabular-nums}
.rtr{font-size:12px;font-weight:600;color:var(--dim);padding:6px 2px;white-space:nowrap}
.rtr.armed{color:var(--coral)}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lane{display:flex;flex-direction:column;gap:6px;border-radius:16px;padding:5px;transition:background .25s,box-shadow .25s}
.lane.can{background:rgba(255,255,255,.025)}
.lane.hot{background:rgba(255,181,71,.1);box-shadow:inset 0 0 0 1.5px var(--amber)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:6px 5px}
.anc{aspect-ratio:5/7;border-radius:8px;background:rgba(255,255,255,.025)}
.loc{position:relative;isolation:isolate;border-radius:14px;overflow:hidden;min-height:96px;height:104px;padding:28px 6px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:2px;color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.35);cursor:pointer}
.loc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 60%;z-index:-1;filter:brightness(.5) saturate(.85)}
.loc::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse 90% 70% at 50% 50%,rgba(8,9,12,.62),rgba(8,9,12,.35)),linear-gradient(180deg,rgba(8,9,12,.3),rgba(8,9,12,.7))}
.loc .mid{text-shadow:0 1px 2px rgba(0,0,0,.85),0 0 10px rgba(0,0,0,.6)}
.loc .lb{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.loc .ln{font-weight:700;font-size:11.5px;line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
.loc .lt{font-size:9.5px;line-height:1.2;opacity:.95}
.sc{position:absolute;left:50%;transform:translateX(-50%);min-width:30px;height:22px;padding:0 8px;border-radius:999px;background:rgba(12,13,16,.85);font-weight:700;font-size:12px;display:grid;place-items:center;transition:background .3s,color .3s;font-variant-numeric:tabular-nums}
.sc.o{top:5px}.sc.p{bottom:5px}
.sc.lead{background:var(--amber);color:#1a1004}
.sc.pop{animation:scpop .4s var(--ease)}
@keyframes scpop{50%{transform:translateX(-50%) scale(1.3)}}
.info{min-height:42px;display:flex;align-items:center;font-size:13px;line-height:1.3;background:var(--surf);border-radius:14px;padding:8px 12px}
.info b{color:var(--amber2);font-weight:600}
.ctl{display:flex;align-items:center;gap:10px}
.orb{width:48px;height:48px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff;background:radial-gradient(circle at 35% 28%,#a9d8ff,var(--energy) 52%,#1f5fa8);box-shadow:0 0 0 4px rgba(74,168,255,.15),0 0 22px rgba(74,168,255,.3)}
.orb.pop{animation:orbpop .35s var(--ease)}
@keyframes orbpop{50%{transform:scale(1.18)}}
.decks{flex:1;min-width:0;font-family:var(--mono);font-size:10.5px;color:var(--dim);line-height:1.5}
.endb{height:46px;padding:0 20px;background:var(--amber);color:#1a1004}
.hz{position:relative;height:var(--hzh,128px);flex:none}
.layer{position:absolute;inset:0;pointer-events:none;z-index:10}
#battle.wide .bwrap{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;grid-template-rows:auto 1fr auto auto;column-gap:14px;row-gap:8px;align-items:center}
#battle.wide .bbar,#battle.wide .board{grid-column:1/-1}
#battle.wide .board{grid-row:2;align-self:center;justify-self:center}
#battle.wide .ctl .decks{white-space:nowrap}
#battle.wide .ctl{display:contents}
#battle.wide .info{grid-column:1/-1;grid-row:3;justify-self:center;width:min(100%,720px);justify-content:center;text-align:center}
#battle.wide .ctl .orb{grid-column:1;grid-row:4}
#battle.wide .ctl .decks{grid-column:2;grid-row:4}
#battle.wide .hz{grid-column:3;grid-row:4}
#battle.wide .ctl .endb{grid-column:4;grid-row:4}
.tc{position:absolute;left:0;top:0;width:var(--hw);transform-origin:0 0;transition:transform .55s var(--ease),opacity .35s,filter .3s;pointer-events:auto;touch-action:none;will-change:transform;cursor:grab}
.tc .tci{position:relative;transform-style:preserve-3d;transition:transform .6s var(--ease)}
.tc .tci.down,.pc .tci.down{transform:rotateY(180deg)}
.tc .cardbox,.pc .cardbox{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.tback{position:absolute;inset:0;border-radius:7%/5%;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:rotateY(180deg);background:radial-gradient(circle at 50% 38%,#2b2e36,#15161a 70%);box-shadow:inset 0 0 0 3px #6b6f77,inset 0 0 0 7px #15161a,inset 0 0 0 8px rgba(255,255,255,.12)}
.tback::after{content:"W";position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:clamp(18px,30%,48px);color:var(--amber);letter-spacing:-.04em}
.tc.drag{transition:opacity .2s,filter .2s;z-index:50;cursor:grabbing}
.tc.drag .card{box-shadow:0 26px 40px rgba(0,0,0,.6)}
.tc.pend .cardbox{filter:brightness(.82)}
.tc.pend::after{content:"";position:absolute;inset:-3px;border-radius:12px;border:2px dashed var(--amber2);pointer-events:none}
.tc.poor .cardbox{filter:saturate(.2) brightness(.6)}
.tc.dead{opacity:0;filter:blur(4px) brightness(2);transition:transform .6s var(--ease),opacity .55s .1s,filter .4s}
.tc.hit .tci{animation:hit .45s}
@keyframes hit{20%{transform:translateX(-6%) rotate(-4deg)}50%{transform:translateX(6%) rotate(3deg)}80%{transform:translateX(-3%)}}
.tc.glow .card{box-shadow:0 0 0 3px var(--amber),0 0 30px rgba(255,181,71,.65)}
.fxorb{position:absolute;left:-10px;top:-10px;width:20px;height:20px;border-radius:50%;pointer-events:none;z-index:70;--c:#ff5b6b;background:radial-gradient(circle,#fff 0 22%,var(--c) 48%,transparent 72%);box-shadow:0 0 16px 6px var(--c);will-change:transform}
.fxorb.good{--c:#ffc94a}.fxorb.drain{--c:#b47bff}.fxorb.copy{--c:#5fd0ff}
.tc.struck .card{animation:struck .6s}
@keyframes struck{0%{filter:none}18%{filter:brightness(2.4) saturate(.2)}40%{transform:translateX(-5%) rotate(-5deg)}60%{transform:translateX(4%) rotate(3deg)}100%{filter:none}}
.tc.buffed .card{animation:buffed .6s}
@keyframes buffed{30%{box-shadow:0 0 0 3px #ffc94a,0 0 26px rgba(255,201,74,.8);transform:scale(1.05)}}
.float{position:absolute;top:-12px;right:-8px;z-index:20;font-weight:800;font-size:16px;pointer-events:none;animation:floatUp 1.2s var(--ease) forwards;text-shadow:0 2px 6px rgba(0,0,0,.8)}
.float.up{color:var(--mint)}.float.down{color:var(--coral)}
@keyframes floatUp{0%{opacity:0;transform:translateY(8px) scale(.6)}20%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-26px)}}
.banner{position:fixed;left:0;right:0;top:40%;z-index:60;text-align:center;pointer-events:none;font-weight:800;font-size:36px;letter-spacing:-.03em;animation:ban 1.5s var(--ease) forwards;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.banner small{display:block;font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.14em;color:var(--amber2);margin-top:8px;text-transform:uppercase}
@keyframes ban{0%{opacity:0;transform:translateX(-40px)}18%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateX(40px)}}
.result{position:fixed;inset:0;z-index:65;display:flex;align-items:center;justify-content:center;background:rgba(5,6,8,.72);backdrop-filter:blur(10px);padding:20px max(16px,env(safe-area-inset-left,0px));animation:fade .4s}
@keyframes fade{from{opacity:0}}
.result .card-s{max-width:420px;width:100%;text-align:center;animation:rise .5s var(--ease)}
@keyframes rise{from{transform:translateY(30px) scale(.96);opacity:0}}
.result h2{font-size:30px}
.lres{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}
.lres div{border-radius:12px;padding:8px 4px;background:var(--bg2);font-size:10.5px;color:var(--dim)}
.lres b{display:block;font-size:16px;color:var(--text);margin-top:3px}
.lres .w b{color:var(--amber2)}

/* ===== shop / packs ===== */
.offers{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.offer{display:flex;gap:16px;align-items:center}
.offer .m{flex:1;min-width:0}
.offer p{margin:4px 0 12px;font-size:13px;color:var(--muted)}
/* Booster pack: square foil wrapper, crimped top and bottom, full-bleed art, logo band and set banner */
.pouch{--p1:#c96f1e;--p2:#ffb547;position:relative;width:84px;aspect-ratio:5/8.4;flex:none;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
.pouch .cap,.pouch .crimp{position:absolute;left:0;right:0;background:linear-gradient(90deg,var(--p1),var(--p2) 22%,#fff6 30%,var(--p2) 38%,var(--p1) 62%,var(--p2) 80%,var(--p1));overflow:hidden}
.pouch .cap::after,.pouch .crimp::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 1px,rgba(255,255,255,.22) 1px 2px,transparent 2px 4px)}
.pouch .cap{top:0;height:8%;z-index:3;transform-origin:0% 100%;clip-path:polygon(0 18%,2.5% 0,5% 18%,7.5% 0,10% 18%,12.5% 0,15% 18%,17.5% 0,20% 18%,22.5% 0,25% 18%,27.5% 0,30% 18%,32.5% 0,35% 18%,37.5% 0,40% 18%,42.5% 0,45% 18%,47.5% 0,50% 18%,52.5% 0,55% 18%,57.5% 0,60% 18%,62.5% 0,65% 18%,67.5% 0,70% 18%,72.5% 0,75% 18%,77.5% 0,80% 18%,82.5% 0,85% 18%,87.5% 0,90% 18%,92.5% 0,95% 18%,97.5% 0,100% 18%,100% 100%,0 100%)}
.pouch .crimp{bottom:0;height:6%;z-index:3;clip-path:polygon(0 0,100% 0,100% 82%,97.5% 100%,95% 82%,92.5% 100%,90% 82%,87.5% 100%,85% 82%,82.5% 100%,80% 82%,77.5% 100%,75% 82%,72.5% 100%,70% 82%,67.5% 100%,65% 82%,62.5% 100%,60% 82%,57.5% 100%,55% 82%,52.5% 100%,50% 82%,47.5% 100%,45% 82%,42.5% 100%,40% 82%,37.5% 100%,35% 82%,32.5% 100%,30% 82%,27.5% 100%,25% 82%,22.5% 100%,20% 82%,17.5% 100%,15% 82%,12.5% 100%,10% 82%,7.5% 100%,5% 82%,2.5% 100%,0 82%)}
.pouch .body{position:absolute;left:0;right:0;top:8%;bottom:6%;z-index:2;overflow:hidden;background:var(--p1);color:#fff;container-type:inline-size}
.pouch .body img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* pillow shading: the wrapper bulges, edges fall into shadow, a vertical highlight runs down the middle */
.pouch .body::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,0) 12%,rgba(255,255,255,.1) 40%,rgba(255,255,255,0) 60%,rgba(0,0,0,0) 88%,rgba(0,0,0,.55)),linear-gradient(180deg,rgba(0,0,0,.35),transparent 30%,transparent 62%,rgba(0,0,0,.6))}
.pouch .logo{position:absolute;left:0;right:0;top:7%;z-index:3;text-align:center;font-weight:800;font-size:13.2cqw;letter-spacing:.03em;line-height:1;color:#fff;text-shadow:0 .6cqw 0 var(--p1),0 1.4cqw 3cqw rgba(0,0,0,.6);-webkit-text-stroke:.5cqw rgba(0,0,0,.35);paint-order:stroke fill}
.pouch .tag{position:absolute;left:50%;top:21%;z-index:3;transform:translateX(-50%);white-space:nowrap;font-size:5.6cqw;font-weight:700;letter-spacing:.14em;padding:1.2cqw 3.2cqw;background:rgba(10,12,16,.72);border:.5cqw solid var(--p2)}
.pouch .set{position:absolute;left:-2%;right:-2%;bottom:13%;z-index:3;text-align:center;padding:3cqw 0 2.6cqw;background:linear-gradient(90deg,transparent,var(--p1) 12%,var(--p2) 50%,var(--p1) 88%,transparent);font-weight:800;font-size:11cqw;letter-spacing:.06em;line-height:1;text-shadow:0 .8cqw 1.6cqw rgba(0,0,0,.5);transform:skewY(-4deg)}
.pouch .cnt{position:absolute;left:0;right:0;bottom:3.5%;z-index:3;display:flex;justify-content:center;align-items:center;gap:2cqw;font-size:5cqw;font-weight:700;letter-spacing:.08em;color:rgba(255,255,255,.88)}
.pouch .cnt b{display:grid;place-items:center;width:8cqw;height:8cqw;border-radius:50%;background:#fff;color:#111;font-size:5cqw}
.pouch .shine{position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.38) 45%,transparent 60%);background-size:260% 100%;animation:sheen 3.5s ease-in-out infinite alternate;mix-blend-mode:overlay}
.pouch::before{content:"";position:absolute;left:3%;right:3%;top:5%;height:6%;background:linear-gradient(#0d0703,#2a1606);z-index:1}
.pouch .seam{position:absolute;left:0;top:8%;height:2px;width:0;background:#fff;box-shadow:0 0 12px 4px rgba(255,236,190,.9);z-index:5;transition:width .1s linear;opacity:0}
#packov{position:fixed;inset:0;z-index:60;overflow:hidden;background:radial-gradient(circle at 50% 42%,#24262d,#08090b 70%);animation:fade .3s}
#packov .kick{position:absolute;left:0;right:0;top:calc(24px + env(safe-area-inset-top,0px));text-align:center}
#packov .stage{position:absolute;left:50%;top:50%;width:0;height:0}
#packov .pouch{z-index:2;position:absolute;width:min(210px,54vw);left:0;top:0;transform:translate(-50%,-50%);transition:transform .6s var(--ease),opacity .5s;touch-action:none;cursor:grab}
#packov .pouch .body span{font-size:20px}
#packov .pouch.wig{animation:wig 2s ease-in-out infinite}
@keyframes wig{0%,100%{transform:translate(-50%,-50%)}8%{transform:translate(-50%,-50%) rotate(-2.5deg)}16%{transform:translate(-50%,-50%) rotate(2.5deg)}24%{transform:translate(-50%,-50%)}}
#packov .pouch .cap{transition:transform .08s linear}
#packov .pouch.torn .cap{transition:transform .7s var(--ease),opacity .7s;transform:translate(60%,-180%) rotate(28deg)!important;opacity:0}
#packov .pouch.drop{transform:translate(-50%,40vh) scale(.92);opacity:0}
#packov .burst{position:absolute;left:0;top:0;width:10px;height:10px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,240,200,.95),rgba(255,200,120,.4) 40%,transparent 70%);opacity:0;pointer-events:none}
#packov .burst.go{animation:burst .9s var(--ease) forwards}
@keyframes burst{0%{opacity:0;width:10px;height:10px}25%{opacity:1}100%{opacity:0;width:620px;height:620px}}
.pc{position:absolute;left:0;top:0;width:var(--pw);perspective:1000px;transition:transform .8s var(--ease),opacity .4s;cursor:pointer}
.pc .tci{position:relative;transform-style:preserve-3d;transition:transform .75s var(--ease)}
.pc.t3.flipped .card{box-shadow:0 0 0 2px #fff6,0 0 28px rgba(120,210,255,.6)}
.pc.t4.flipped .card{box-shadow:0 0 0 2px #fff8,0 0 34px rgba(190,140,255,.7)}
.pc.t5.flipped .card{box-shadow:0 0 0 2px #fff,0 0 44px rgba(255,200,90,.9)}
.pc .lbl{position:absolute;left:50%;bottom:-28px;transform:translateX(-50%);white-space:nowrap;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surf3);opacity:0;transition:opacity .4s .5s}
.pc.flipped .lbl{opacity:1}
.pc .lbl.new{background:var(--coral);color:#fff}
.pc .lbl.var{background:var(--energy);color:#04213d}
#packov .done{position:absolute;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:8px;opacity:0;transition:opacity .4s}
#packov .done.on{opacity:1}
.pc .pinfo{position:absolute;left:50%;top:calc(100% + 38px);width:max(100%,150px);transform:translateX(-50%);text-align:left;font-size:11.5px;line-height:1.35;color:var(--muted);opacity:0;transition:opacity .4s .6s;pointer-events:none}
.pc.flipped .pinfo{opacity:1}
.pc.taken .pinfo{opacity:0;transition-delay:0s}
.pc .pinfo .pn{font-weight:700;font-size:13px;color:var(--text)}
.pc .pinfo .pm{display:flex;align-items:center;gap:5px;margin-top:3px;font-size:10.5px;flex-wrap:wrap}
.pc .pinfo .pm .e,.pc .pinfo .pm .w{display:grid;place-items:center;min-width:17px;height:17px;padding:0 3px;font-weight:700;font-size:10.5px;color:#fff}
.pc .pinfo .pm .e{border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--energy)}
.pc .pinfo .pm .w{clip-path:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%);background:rgba(255,181,71,.25);color:var(--amber2)}
.pc .pinfo .pa{margin-top:6px}
.pc .pinfo .pa p{margin:0 0 4px}
.pc .pinfo .pa b{color:var(--amber2)}
.pc .pinfo .ps{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.pc .pinfo .ps span{font-size:10.5px;color:#9ff0c6}
.pc .pinfo .ps span::before{content:"+ ";font-weight:700}
.pc.sel .card{outline:3px solid var(--amber);outline-offset:3px}
.pc.sel .pinfo .pn{color:var(--amber2)}
@media (max-width:520px){.pc .pinfo{width:100%;font-size:10.5px}.pc .pinfo .pn{font-size:12px}}
.tally{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:10px}
.tally div{text-align:center;padding:8px 2px;border-radius:10px;background:var(--bg2);font-size:10.5px;color:var(--dim)}
.tally b{display:block;font-size:16px;color:var(--text)}
.mini-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin-top:10px}

/* ===== runs ===== */
.hero{padding-top:8px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stats div{background:var(--surf);border-radius:14px;padding:12px 10px;font-size:11.5px;color:var(--muted)}
.stats b{display:block;font-size:20px;font-weight:700;color:var(--text);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.how{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:var(--muted);font-size:14px;max-width:62ch}
.how b{color:var(--text);font-weight:600}
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:var(--surf);border-radius:16px;padding:12px 14px}
.hud>div:last-child{text-align:right}
.hud b{display:block;font-size:18px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hearts{display:flex;gap:6px}
.heart{width:18px;height:16px;background:var(--surf3);clip-path:path('M9 16 C9 16 0 10 0 4.6 C0 1.8 2.2 0 4.6 0 C6.6 0 8.2 1.2 9 2.8 C9.8 1.2 11.4 0 13.4 0 C15.8 0 18 1.8 18 4.6 C18 10 9 16 9 16Z')}
.heart.on{background:var(--coral)}
.trail{display:flex;align-items:center;gap:0}
.node{flex:1;min-width:0;background:var(--surf);border-radius:14px;padding:10px 12px;font-size:11px;color:var(--dim)}
.node b{display:block;font-size:13px;color:var(--muted);font-weight:600}
.node span{display:block;min-height:1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node.now{background:var(--surf3);box-shadow:inset 0 0 0 1.5px var(--amber)}
.node.now b{color:var(--text)}
.node.done{opacity:.45}
.node.boss span{color:var(--coral)}
.trail .link{flex:none;width:10px;height:2px;background:var(--surf3)}
.next{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.lnk{color:var(--amber2);font-weight:600;font-size:12.5px;text-decoration:underline;text-underline-offset:2px}
.lnk[disabled]{opacity:.4;pointer-events:none}
.shopgrid{display:grid;grid-template-columns:3fr 2fr;gap:14px;align-items:start}
@media (max-width:640px){.shopgrid{grid-template-columns:1fr}}
.offers3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.offers2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.offer2{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surf);border-radius:14px;padding:10px}
.offer2 .cell{width:100%}
.oname{font-size:11.5px;font-weight:600;text-align:center;line-height:1.2;min-height:2.4em;display:flex;align-items:center}
.offer2.sold .cell,.offer2.sold .pk-s{opacity:.3}
.pk-s{display:grid;place-items:center;padding:4px 0}
.pk-s .pouch{width:78px}

.gear.mine{background:var(--surf2)}
.gear.empty{display:flex;align-items:center;justify-content:center;min-height:62px;color:var(--dim);font-size:12px;background:transparent;border:1px dashed var(--line2)}
.gi{width:40px;height:40px;border-radius:12px;background:var(--bg2);display:grid;place-items:center;font-size:20px}
.gt{min-width:0}
.gt b{display:block;font-size:13.5px;font-weight:600}
.gt span{display:block;font-size:12px;color:var(--muted);line-height:1.35}
.lvl{position:absolute;z-index:8;left:-4px;bottom:-6px;font-weight:700;font-size:10px;padding:3px 7px;border-radius:999px;background:var(--surf3);color:var(--text);box-shadow:0 4px 10px rgba(0,0,0,.35)}
.ups{margin-top:12px;display:flex;flex-direction:column;gap:6px;text-align:left;font-size:13px;color:var(--muted);background:var(--bg2);border-radius:12px;padding:10px 12px}
.ups b{color:var(--amber2);font-weight:600}
.result.peek{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s,visibility 0s .25s}
.result{transition:opacity .25s}
.prog{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 10px;margin-top:14px}
.pg{width:64px;display:flex;flex-direction:column;gap:5px;opacity:.55;transition:opacity .3s;position:relative}
.pg.on{opacity:1}
.pgc{width:64px;position:relative}
.pgb{height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.pgb i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--amber2));border-radius:3px;transition:width .65s var(--ease)}
.pgl{display:flex;justify-content:space-between;font-size:10px;font-family:var(--mono);color:var(--muted);line-height:1}
.pgl em{font-style:normal;color:var(--amber2)}
.pg.lvup .pgc{animation:lvup 1s var(--ease)}
.pg.lvup::before{content:attr(data-up);position:absolute;left:50%;top:-8px;transform:translateX(-50%);z-index:3;white-space:nowrap;font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:var(--amber);color:#1a1205;padding:2px 6px;border-radius:999px;animation:upbadge 1.2s var(--ease) both}
@keyframes lvup{0%{transform:scale(1)}25%{transform:scale(1.22) rotate(-3deg);filter:brightness(1.8) drop-shadow(0 0 14px rgba(255,201,74,.9))}55%{transform:scale(.96) rotate(1deg)}100%{transform:scale(1);filter:none}}
@keyframes upbadge{0%{opacity:0;transform:translate(-50%,6px) scale(.6)}30%{opacity:1;transform:translate(-50%,-4px) scale(1.1)}100%{opacity:1;transform:translate(-50%,0) scale(1)}}
.trk{margin-top:10px}
.trk summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.tks{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.tk{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center;font-size:12.5px;color:var(--dim)}
.tk b{width:24px;height:24px;border-radius:8px;background:var(--bg2);display:grid;place-items:center;font-size:11px}
.tk.on{color:var(--text)}
.tk.on b{background:var(--amber);color:#1a1004}

.sty{display:inline-block;padding:1px 7px;border-radius:99px;background:var(--surf3,#2a2c33);color:var(--text);font-weight:600;font-size:11.5px;margin-left:2px}
.scout{flex-basis:100%;display:flex;align-items:center;gap:8px;padding-top:12px;border-top:1px solid rgba(255,255,255,.06)}
.scout .cell{width:46px;flex:none;padding:0}

/* ===== one screen, no scrolling ===== */
html,body{overflow:hidden;margin:0}
#app{height:100%;height:100dvh;min-height:0;overflow:hidden}
.top{position:relative;padding-block:10px}
main{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;padding-block:2px calc(86px + env(safe-area-inset-bottom,0px))}
.page{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.fill{flex:1;min-height:0;display:flex;flex-direction:column}
.fitgrid{flex:1;min-height:0;display:grid;justify-content:center;align-content:center;gap:10px 8px;grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}

.fitgrid>p{grid-column:1/-1;text-align:center}
.seg{flex-wrap:wrap;overflow:visible}
.ptitle{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ptitle h1{font-size:24px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surf);color:var(--muted)}
.chip.on{background:var(--text);color:var(--bg)}
.lobby{justify-content:center;max-width:720px;width:100%;margin:0 auto}
/* camp */
.camp{gap:10px}
.camp .hud{padding:8px 14px}
.camp .node{padding:7px 10px}
.next{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:12px 14px}
.next h2{font-size:18px;margin-top:2px}
.nx-d{margin:3px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.next .scout{flex-basis:auto;padding:0;border:0;gap:5px}
.next .scout .cell{width:38px}
@media (max-width:640px){.next{grid-template-columns:minmax(0,1fr) auto}.next .nx-main{grid-column:1/-1}}
.ctabs{align-items:center}
.offer2{padding:6px;gap:6px}
.pk-s{padding:0;width:100%;display:flex;justify-content:center}
.pk-s .pouch{width:83%}
.gearcols{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}

.gearlist{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.gear{padding:7px 10px}
.gt span{display:block;font-size:11.5px;line-height:1.3}

.cell .dots{display:flex;justify-content:center;gap:4px;margin-top:5px}
.cell .dots i{width:6px;height:6px;border-radius:50%;background:var(--surf3)}
.cell .dots i.on{background:var(--mint)}
/* zoom panel, compact */
#zoom{overflow:hidden}
.zinfo{width:min(100%,560px)}

.zinfo .vars span{display:none}
.how{gap:6px;font-size:13.5px}

const TRX=new Map(), TRP=[];
if(PT){ for(const [k,v] of Object.entries(TR_PT)){ if(k.includes('{}')){ const lits=k.split('{}'); TRP.push({lits,out:v,lit:lits.join('').length,weak:!/[A-Za-z]/.test(lits.join(''))}); } TRX.set(k,v); }
  TRP.sort((a,b)=>b.lit-a.lit); }   // most specific patterns first
/* match "a{}b{}c" against s by finding the literal pieces in order (no regex backtracking blow-ups) */
function trMatch(lits,s){ const n=lits.length-1, first=lits[0], last=lits[n];
  if(!s.startsWith(first)||!s.endsWith(last)||s.length<first.length+last.length) return null;
  for(let i=1;i<n;i++) if(!s.includes(lits[i])) return null;
  const end=s.length-last.length, caps=[];
  const go=(pos,i)=>{ if(i===n){ caps.push(s.slice(pos,end)); return true; }
    let at=s.indexOf(lits[i],pos), tries=0;
    while(at>=0&&at+lits[i].length<=end&&tries++<6){ caps.push(s.slice(pos,at)); if(go(at+lits[i].length,i+1)) return true; caps.pop(); at=s.indexOf(lits[i],at+1); }
    return false; };
  return go(first.length,1)?caps:null; }
function trFill(out,caps){ return out.replace(/\{(\d+)(?:([#?])([^|}]*)\|([^}]*))?\}/g,(m,i,op,a,b)=>{ const c=caps[+i]??''; if(!op) return c;
  if(op==='#') return parseFloat(String(c).replace(/[^\d.-]/g,''))===1?a:b; return c.trim()?a:b; }); }
function trCore(s,depth,weak){ const ex=TRX.get(s); if(ex!=null) return ex; if(depth>2||!/[A-Za-z]/.test(s)) return s;
  for(const p of TRP){ if(p.weak&&!weak) continue; const m=trMatch(p.lits,s); if(m) return trFill(p.out,m.map(c=>trWrap(c,depth+1))); } return s; }
function trWrap(raw,depth,weak){ const m=/^(\s*)([\s\S]*?)(\s*)$/.exec(raw); const core=m[2].replace(/\s+/g,' '); if(!core) return raw; const o=trCore(core,depth,weak); return o===core?raw:m[1]+o+m[3]; }
const TRC=new Map();
function trText(raw){ if(!PT||!/[A-Za-z]/.test(raw)) return raw; let o=TRC.get(raw); if(o===undefined){ o=trWrap(raw,0); if(TRC.size<5000) TRC.set(raw,o); } return o; }
const trLog=m=>PT?trWrap(m,0,true):m;   // battle log lines: also allow the punctuation-only patterns
/* L(): translate a template in code. Keys use {} for each value, in order. */
function L(k,...a){ const v=PT?TRX.get(k):null; if(v==null){ let i=0; return k.replace(/\{\}/g,()=>a[i++]??''); } return trFill(v,a.map(x=>typeof x==='string'?trWrap(x,1):String(x))); }
/* translate the page as it changes; card faces are built in Portuguese already and skipped */
const TR_SKIP='.cardbox,textarea,script,style,[data-notr]';
const TR_DONE=new WeakMap();
function trNode(n){ if(TR_DONE.get(n)===n.data) return; const p=n.parentElement; if(!p||p.closest(TR_SKIP)) return; const t=trText(n.data); TR_DONE.set(n,t); if(t!==n.data) n.data=t; }
const TR_ADONE=new WeakMap();
function trEl(el){ let d=TR_ADONE.get(el); for(const a of ['title','aria-label','placeholder']){ const v=el.getAttribute(a); if(v&&!(d&&d[a]===v)){ const t=trText(v); if(!d){ d={}; TR_ADONE.set(el,d); } d[a]=t; if(t!==v) el.setAttribute(a,t); } } }
function trTree(root){ if(root.nodeType===3){ trNode(root); return; } if(root.nodeType!==1||root.closest(TR_SKIP)) return; trEl(root);
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT,{acceptNode:n=>n.nodeType===1&&n.matches(TR_SKIP)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  for(let n=w.nextNode();n;n=w.nextNode()){ if(n.nodeType===3) trNode(n); else trEl(n); } }
if(PT){ const mo=new MutationObserver(ms=>{ for(const m of ms){ if(m.type==='characterData') trNode(m.target); else if(m.type==='attributes') trEl(m.target); else m.addedNodes.forEach(trTree); } });
  const start=()=>{ trTree(document.body); mo.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['title','aria-label','placeholder']}); };
  document.body?start():addEventListener('DOMContentLoaded',start); }

function eye(x,y,r){ return Ac(x,y,r,'e')+Ac(x-r*.3,y-r*.35,r*.35,'hl'); }

  const boss=r.node===2, final=r.ante===3&&boss, cap=themeCap(r,boss,final), bio=runBio(r);

  if(!final&&Math.random()<.2){ const home=pool.find(t=>t.k==='bio_'+bio); if(home) pool=[home]; }

  r.seenThemes=[...(r.seenThemes||[]),t.k];
  let style=pick(STYLES).k; if(final) style=pick(['sharp','focused','bold']);

}

function fitGrids(root=document){
  root.querySelectorAll('.fitgrid').forEach(g=>{
    const items=[...g.children].filter(x=>x.nodeType===1&&x.tagName!=='P'), n=items.length; if(!n) return;
    g.style.gridTemplateColumns=''; const W=g.clientWidth, H=g.clientHeight; if(!W||!H) return;
    const gx=8, gy=10, ex=+g.dataset.extra||0, pad=+g.dataset.pad||0, mx=+g.dataset.max||200;
    let best=0, bc=1;
    for(let c=1;c<=n;c++){ const rr=Math.ceil(n/c); const w=Math.min((W-gx*(c-1))/c, ((H-gy*(rr-1))/rr-ex)/1.4+pad); if(w>best){ best=w; bc=c; } }
    best=Math.max(36,Math.min(best,mx));
    g.style.gridTemplateColumns=`repeat(${bc},${Math.floor(best)}px)`;
  });
}

const b64u={ enc:u8=>{ let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); },
  dec:t=>{ t=t.replace(/-/g,'+').replace(/_/g,'/'); while(t.length%4) t+='='; const s=atob(t), u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; } };
async function makeSaveCode(){
  const raw=new TextEncoder().encode(JSON.stringify(SV));
  if(window.CompressionStream){ try{ const z=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer()); return 'WC1.'+b64u.enc(z); }catch(e){} }
  return 'WC0.'+b64u.enc(raw);
}
async function readSaveCode(code){
  code=(code||'').trim().replace(/\s+/g,''); const m=code.match(/^WC([01])\.([A-Za-z0-9_-]+)$/); if(!m) throw new Error('format');
  let bytes=b64u.dec(m[2]);
  if(m[1]==='1'){ if(!window.DecompressionStream) throw new Error('old'); bytes=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()); }
  const data=JSON.parse(new TextDecoder().decode(bytes)); if(!data||typeof data.cards!=='object'||!data.best) throw new Error('data'); return data;
}

function zoom(srcEl,id,opts={}){

function sizeZoomCard(){ const z=$('#zoom'), zc=z.querySelector('.zcard'); if(!zc) return; const inf=z.querySelector('.zinfo');

function tiltLoop(){

/* =====================================================================
   PACKS — bought in the run shop; tear it open, pick one

let PK=null;
const BIOART={SAV:'lion',RAIN:'macaw',OCN:'orca',TUN:'polarbear',DES:'camel',FOR:'wolf',WET:'flamingo'};
function packSkin(p){
  if(p.k==='field') return {k:'field',n:'Field Pack',sub:'Pick 1 of 3, any biome',p1:'#b85f1a',p2:'#ffb547',art:['lion','field'],label:'FIELD'};
  if(p.k==='gear') return {k:'gear',n:'Gear Crate',sub:'Pick 1 of 2 Field Gear',p1:'#4b5160',p2:'#c9d1de',art:['owl','field'],label:'GEAR'};
  return {k:'biome',n:PT?`Pacote ${PT_BIO_IN[p.bio]}`:`${BIO[p.bio].n} Pack`,sub:PT?`Escolha 1 de 3 animais ${PT_BIO_IN[p.bio]}`:`Pick 1 of 3 ${BIO[p.bio].n} animals`,p1:shade(BIO[p.bio].c,-.35),p2:shade(BIO[p.bio].c,.25),art:[BIOART[p.bio],'field'],label:BIO[p.bio].n.toUpperCase()};
}
function pouchHTML(s){ return `<div class="pouch" style="--p1:${s.p1};--p2:${s.p2}"><div class="cap"></div><div class="body"><img src="${artFor(s.art[0],s.art[1]).bg}" alt=""><div class="logo">WILDCARDS</div><div class="set">${s.label}</div><div class="cnt"><b>${s.k==="gear"?2:3}</b>${s.k==="gear"?"ITEMS":"CARDS"} · PICK 1</div><i class="shine"></i></div><div class="crimp"></div><div class="seam"></div></div>`; }
function rollPackCards(p){
  const r=SV.run, cap=tierCap(r.ante), base=SET.filter(d=>d.tier<=cap&&(p.k!=='biome'||d.bio===p.bio)&&!r.deck.includes(d.id));
  const unknown=base.filter(d=>!known(d.id)), out=[];
  for(let i=0;i<3&&base.length;i++){
    const left=base.filter(d=>!out.some(o=>o.id===d.id)), unk=left.filter(d=>!known(d.id));
    const pool=(unk.length&&Math.random()<(i===0?.7:.35))?unk:left; if(!pool.length) break;
    const d=pickWeighted(pool); out.push({id:d.id,isNew:!known(d.id)});
  }
  return out;
}
function buyPack(i){
  const r=SV.run, p=r.shop.packs[i]; if(p.sold||r.coins<p.price) return;
  if(p.k==='gear'){
    if(r.gear.length>=5){ toast('Your gear slots are full. Sell one first.'); return; }
    const opts=rollGear(r,2); if(!opts.length){ toast('You already own every piece of gear.'); return; }
    r.coins-=p.price; p.sold=true; save(); render();
    showSheet(`<div class="card-s"><div class="kicker">Gear Crate</div><h2 style="margin-top:4px">Pick one</h2><div class="gearrow" style="margin-top:12px">${opts.map(o=>gearTile(GEARK[o.k],`<button class="btn sm amber" data-act="takegear" data-k="${o.k}">Take</button>`)).join('')}</div></div><button class="btn ghost" data-act="zclose">Skip</button>`);
    return;
  }
  const res=rollPackCards(p); if(!res.length){ toast('Nothing left to find in this pack.'); return; }
  r.coins-=p.price; p.sold=true; save(); render();
  PK={s:packSkin(p),res,flipped:new Set(),stage:'sealed',prog:0};
  packStage();
}
/* What a pack card would add to this run: its ability, plus how it links up with the run deck */
function synergyNote(id){
  const d=DB[id], deck=SV.run?SV.run.deck.map(x=>DB[x]):[], notes=[];
  const cnt=f=>deck.filter(f).length;
  for(const a of d.abs){
    if(a.k==='HERD'){ const n=cnt(x=>x.diet==='H'); if(n) notes.push(`${n} Herbivore${n>1?'s':''} in your deck`); }
    if(a.k==='FLOCK'){ const n=cnt(x=>x.cls==='B'); if(n) notes.push(`${n} Bird${n>1?'s':''} in your deck`); }
    if(a.k==='COLONY'){ const n=cnt(x=>x.cls==='I'); if(n) notes.push(`${n} Invertebrate${n>1?'s':''} in your deck`); }
    if(a.k==='HUDDLE'){ const n=cnt(x=>x.bio==='TUN'); if(n) notes.push(`${n} Tundra animal${n>1?'s':''} in your deck`); }
    if(a.k==='PACKPOW'){ const n=cnt(x=>isPack(x)); if(n) notes.push(`${n} Pack animal${n>1?'s':''} in your deck`); }
    if(a.k==='SYMB'){ const n=cnt(x=>x.cls===a.x); if(n) notes.push(`${n} ${CLS[a.x]}${n>1?'s':''} in your deck`); }
  }
  const helps=deck.filter(x=>x.abs.some(a=>(a.k==='HERD'&&d.diet==='H')||(a.k==='FLOCK'&&d.cls==='B')||(a.k==='COLONY'&&d.cls==='I')||(a.k==='HUDDLE'&&d.bio==='TUN')||(a.k==='PACKPOW'&&isPack(d))||(a.k==='SYMB'&&a.x===d.cls)));
  if(helps.length) notes.push(`Boosts ${helps.slice(0,2).map(x=>x.name).join(', ')}${helps.length>2?` and ${helps.length-2} more`:''}`);
  for(const a of d.abs) if(a.k==='BUDDY'&&deck.some(x=>x.id===a.x)) notes.push(`Best friends with your ${DB[a.x].name}`);
  for(const x of deck) for(const a of x.abs) if(a.k==='BUDDY'&&a.x===d.id) notes.push(`Your ${x.name}'s best friend`);
  if(d.abs.some(a=>a.k==='FLEE')&&deck.some(x=>FELINE.has(x.id))) notes.push('Your cats can chase it around');
  if(FELINE.has(d.id)&&deck.some(x=>x.abs.some(a=>a.k==='FLEE'))) notes.push('Scares your mouse into a better spot');
  if(d.abs.some(a=>a.k==='STEAL')){ const n=deck.filter(x=>x.diet==='C').length; if(n) notes.push(`${n} Carnivore${n>1?'s':''} in your deck for the clan`); }
  if(d.abs.some(a=>a.k==='CURRENT')){ const n=deck.filter(x=>x.cls==='F').length; if(n) notes.push(`${n} Fish in your deck to ride the current`); }
  const gear=(SV.run?.gear||[]).filter(k=>GEARK[k].pw&&GEARK[k].pw(d)); if(gear.length) notes.push(`${gear.map(k=>GEARK[k].n).join(', ')} applies`);
  return notes;
}
function pickInfo(id){ const d=DB[id], notes=synergyNote(id);
  return `<div class="pinfo"><div class="pn">${esc(d.name)}</div><div class="pm"><span class="e">${d.cost}</span><span class="w">${d.pow}</span>${CLS[d.cls]} · ${BIO[d.bio].n} · ${DIET[d.diet]}</div><div class="pa">${abText(d)}</div>${notes.length?`<div class="ps">${notes.map(n=>`<span>${esc(n)}</span>`).join('')}</div>`:''}</div>`; }
function packStage(){
  const ov=$('#packov'); ov.hidden=false;
  ov.innerHTML=`<div class="kick"><div class="kicker">${esc(PK.s.n)}</div><p class="small" style="margin:6px 0 0" id="pkhint">Drag across the top edge to tear it open, or tap it.</p></div>
    <div class="stage" id="pstage"><div class="burst" id="burst"></div>${pouchHTML(PK.s)}</div><div class="done" id="pdone"><button class="btn ghost" data-act="pskip">Skip</button></div>`;
  const p=ov.querySelector('.pouch'); p.classList.add('wig');
  const cap=p.querySelector('.cap'), seam=p.querySelector('.seam'); let st=null;
  const setProg=v=>{ PK.prog=Math.max(PK.prog,Math.min(1,v)); seam.style.width=(PK.prog*100)+'%'; seam.style.opacity=PK.prog>0?1:0; cap.style.transform=`rotate(${-PK.prog*9}deg) translateY(${-PK.prog*6}px)`; };
  p.addEventListener('pointerdown',e=>{ if(PK.stage!=='sealed') return; e.preventDefault(); p.classList.remove('wig'); const r=p.getBoundingClientRect(); st={x0:r.left,w:r.width,sx:e.clientX,moved:false}; p.setPointerCapture(e.pointerId); });
  p.addEventListener('pointermove',e=>{ if(!st) return; if(Math.abs(e.clientX-st.sx)>6) st.moved=true; if(st.moved) setProg((e.clientX-st.x0)/st.w); if(PK.prog>=.97){ st=null; tear(); } });
  p.addEventListener('pointerup',()=>{ if(!st) return; const moved=st.moved; st=null; if(!moved||PK.prog>.45) autoTear(); else { PK.prog=0; seam.style.width='0'; seam.style.opacity=0; cap.style.transform=''; p.classList.add('wig'); } });
  async function autoTear(){ const from=PK.prog; for(let i=1;i<=14;i++){ setProg(from+(1-from)*i/14); await sleep(22); } tear(); }
}
async function tear(){
  if(PK.stage!=='sealed') return; PK.stage='torn';
  const ov=$('#packov'), p=ov.querySelector('.pouch'), stage=$('#pstage');
  p.classList.add('torn'); $('#pkhint').textContent='';
  await sleep(250); $('#burst').classList.add('go');
  const W=Math.min(170,(innerWidth-56)/3), H=W*1.4, n=PK.res.length;
  stage.style.setProperty('--pw',W+'px');
  const pr=p.getBoundingClientRect(), sr=stage.getBoundingClientRect(), topY=pr.top-sr.top+pr.height*.18;
  PK.res.forEach((r,k)=>{ const d=DB[r.id], o={...(SV.cards[r.id]||{})};
    const el=document.createElement('button'); el.className=`pc t${d.tier}`; el.dataset.act='pflip'; el.dataset.k=k;
    el.innerHTML=`<div class="tci down">${cardHTML(r.id,o)}<div class="tback"></div></div>${r.isNew?'<span class="lbl new">New discovery</span>':`<span class="lbl">Lv ${levelOf(SV.cards[r.id])}</span>`}${pickInfo(r.id)}`;
    el.style.transition='none'; el.style.zIndex=1; el.style.transform=`translate(${-W/2}px,${topY+10}px) scale(.82)`; el.style.opacity='0';
    stage.insertBefore(el,p); });
  stage.getBoundingClientRect();
  const cards=[...stage.querySelectorAll('.pc')];
  for(let k=0;k<n;k++){ const el=cards[k]; el.style.transition='transform .6s var(--ease),opacity .2s'; el.style.opacity='1'; el.style.transform=`translate(${-W/2+(k-1)*6}px,${topY-H*.85-k*10}px) rotate(${(k-1)*3}deg) scale(.9)`; await sleep(180); }
  await sleep(250); p.classList.add('drop'); setTimeout(()=>p.remove(),650);
  await sleep(200);
  const gap=Math.min(14,(innerWidth-W*3)/4);
  const lift=Math.min(150,innerHeight*.17);
  cards.forEach((el,k)=>{ el.style.transition=''; el.style.zIndex=5; el.style.transform=`translate(${-W/2+(k-(n-1)/2)*(W+gap)}px,${-H/2-lift}px)`; });
  PK.stage='spread'; $('#pdone').classList.add('on');
  for(let k=0;k<n;k++){ await sleep(260); cards[k].querySelector('.tci').classList.remove('down'); cards[k].classList.add('flipped'); PK.flipped.add(k); }
  PK.stage='pick'; PK.sel=null; $('#pkhint').textContent='Tap a card to choose it, then add it to your run deck';
}
function pselect(k){
  if(!PK||PK.stage!=='pick') return;
  if(PK.sel===k){ pflip(k); return; }
  PK.sel=k; document.querySelectorAll('#pstage .pc').forEach((el,i)=>el.classList.toggle('sel',i===k));
  $('#pdone').innerHTML=`<button class="btn amber" data-act="ptake">Add ${esc(DB[PK.res[k].id].name)}</button><button class="btn ghost" data-act="pskip">Skip</button>`;
}
async function pflip(k){

  const r=PK.res[k], cards=[...document.querySelectorAll('#pstage .pc')];
  $('#pdone').classList.remove('on');

  SV.run.deck.push(r.id);

const MIME={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp'};
async function putLayer(id,v,layer,file){
  const ext=(file.name.split('.').pop()||'').toLowerCase(), type=MIME[ext]||file.type;
  if(!/^image\/(png|jpeg|webp)$/.test(type)) throw {code:'unsupported_type'};
  const dims=await new Promise(r=>{ const im=new Image(); im.onload=()=>r([im.naturalWidth,im.naturalHeight]); im.onerror=()=>r([0,0]); im.src=URL.createObjectURL(file); });
  const bleed=dims[0]>0 && Math.abs(dims[0]/dims[1]-.75)<.01;
  if(!CAP.assets||!CAP.db){ const k=artKey(id,v); LOCAL[k]={...(LOCAL[k]||artEntry(id,v)||{}),[layer]:URL.createObjectURL(file),bleed}; return; }
  const res=await CAP.assets.upload(file,{type});
  const ref=CAP.db.collection('art').doc(artKey(id,v)), cur=(await ref.get()).data()||{};
  await ref.set({...cur,card:id,variant:v,[layer]:res.id,bleed,at:Date.now()});
  ARTDB[artKey(id,v)]={...cur,card:id,variant:v,[layer]:res.id,bleed};
}
async function clearLayer(id,v,layer){
  const k=artKey(id,v);
  if(LOCAL[k]){ delete LOCAL[k][layer]; if(!LOCAL[k].bg&&!LOCAL[k].fg) delete LOCAL[k]; }
  if(CAP.db&&ARTDB[k]){ const ref=CAP.db.collection('art').doc(k), cur={...((await ref.get()).data()||{})}, old=cur[layer]; delete cur[layer];
    if(cur.bg||cur.fg) await ref.set(cur); else await ref.delete();
    if(cur.bg||cur.fg) ARTDB[k]=cur; else delete ARTDB[k];
    if(old&&CAP.assets){ try{ await CAP.assets.delete(old); }catch(e){} } }
  refreshAll();
}
const UPERR={too_large:'That file is over 20 MB. Export a smaller version.',unsupported_type:'Use PNG, JPG or WebP.',quota_or_state:'Storage is full for this page.',rate_limited:'Too many uploads at once. Wait a moment and try again.'};
async function onUpload(input){
  const f=input.files[0]; if(!f) return; ST.busy=true; zoomRefresh();
  try{ await putLayer(input.dataset.id,ST.v,input.dataset.up,f); toast('Picture added.'); }
  catch(e){ toast(UPERR[e?.code]||'Upload failed. Try again.'); }
  ST.busy=false; refreshAll();
}
async function onBulk(input){
  const files=[...input.files]; if(!files.length) return;
  const re=/^(?:[T]?\d{2,3}_)?([a-z0-9]+)(?:[_ -](base|field|dusk|night|sketch|v[123]|variant[ _-]?[123]))?(?:_(bg|fg))?\.(png|jpe?g|webp)$/i;
  let ok=0; const miss=[];
  for(let i=0;i<files.length;i++){ const f=files[i], m=f.name.match(re);
    if(!m||!DB[m[1].toLowerCase()]){ miss.push(f.name); continue; }
    toast(`Uploading ${i+1} of ${files.length}…`);
    try{ await putLayer(m[1].toLowerCase(),VSFX[(m[2]||'base').toLowerCase().replace(/[ _-]/g,'')]||'field',(m[3]||'bg').toLowerCase(),f); ok++; }catch(e){ miss.push(f.name); } }
  refreshAll();
  showSheet(`<div class="card-s"><h2>${ok} picture${ok===1?'':'s'} matched</h2>${miss.length?`<p class="small" style="margin:8px 0 0">Couldn't match ${miss.length} file${miss.length===1?'':'s'}. Name files like <span class="mono">008_wolf.png</span> for the base picture and <span class="mono">008_wolf_v1.png</span>, <span class="mono">_v2</span>, <span class="mono">_v3</span> for variants.</p><p class="mono" style="margin:8px 0 0;word-break:break-all">${miss.slice(0,12).map(esc).join('<br>')}${miss.length>12?'<br>…':''}</p>`:''}</div><button class="btn ghost" data-act="zclose">Close</button>`);
}
function sheetCSV(){
  const q=s=>`"${String(s).replace(/"/g,'""')}"`;
  const rows=[['number','card_id','name','tier','class','biome','cost','power','picture','filename','status','asset_url']];
  for(const d of ALLCARDS()) for(const v of VARS){ const e=artEntry(d.id,v.k), a=ARTDB[artKey(d.id,v.k)];
    rows.push([cardNo(d),d.id,d.name,d.tier||'token',CLS[d.cls],BIO[d.bio].n,d.cost,d.pow,v.n,fname(d,v.k),e&&e.bg?'added':'placeholder',a&&a.bg?'/_blob/'+a.bg:'']); }
  return rows.map(r=>r.map(q).join(',')).join('\n');
}
async function exportSheet(){

}

function fxHit(u,kind){ const r=CEL.get(u); if(!r) return; const el=r.el; el.classList.remove('hit','struck','buffed'); void el.offsetWidth; el.classList.add(kind||'hit'); setTimeout(()=>el.classList.remove(kind||'hit'),650); }
async function playFx(fx){
  if(!fx.length) return;
  const steps=[]; for(const f of fx){ const last=steps[steps.length-1]; if(last&&last.type===f.type&&last.src===f.src) last.us.push(f.u); else steps.push({type:f.type,src:f.src,us:[f.u]}); }
  for(const s of steps.slice(0,6)){
    const us=s.us.filter(u=>CEL.get(u)), first=us[0]; if(!first&&s.type!=='move') continue;
    switch(s.type){
      case 'hit': us.forEach(u=>fxOrb(s.src,u,'bad',380)); await sleep(360); us.forEach(u=>fxHit(u)); await sleep(200); break;
      case 'drain': us.forEach(u=>fxHit(u)); await sleep(120); us.forEach(u=>fxOrb(u,s.src,'drain',420)); await sleep(420); fxHit(s.src,'buffed'); await sleep(140); break;
      case 'kill': fxLunge(s.src,first,.55,460); await sleep(190); us.forEach(u=>{ fxHit(u,'struck'); }); await sleep(330); break;
      case 'push': fxLunge(s.src,first,.5,440); await sleep(185); us.forEach(u=>fxHit(u)); await sleep(160); break;
      case 'scare': fxLunge(s.src,first,.3,380); await sleep(170); us.forEach(u=>fxHit(u)); await sleep(120); break;
      case 'buff': us.forEach(u=>fxOrb(s.src,u,'good',380)); await sleep(360); us.forEach(u=>fxHit(u,'buffed')); await sleep(160); break;
      case 'copy': fxOrb(first,s.src,'copy',420); await sleep(420); fxHit(s.src,'buffed'); await sleep(120); break;
      case 'pull': us.forEach(u=>fxOrb(s.src,u,'copy',320)); await sleep(300); break;
    }
  }
}

/* drag and drop */
function laneAt(x,y){ for(const ln of document.querySelectorAll('#board .lane')){ const r=ln.getBoundingClientRect(); if(x>=r.left&&x<=r.right&&y>=r.top-10&&y<=r.bottom+10) return +ln.dataset.l; } return null; }
function onDown(e){
  const el=e.target.closest('.tc'); if(!el||!G) return; e.preventDefault();
  const u=+el.dataset.u, rec=CEL.get(u); if(!rec) return;
  const where=el.dataset.where, mine=el.dataset.owner==='p';
  const pend=G.pq.find(q=>q.c.u===u);
  const draggable = !G.busy && !G.over && mine && (where==='hand'||pend);
  const lr=$('#layer').getBoundingClientRect(), br=el.getBoundingClientRect();
  DRAG={u,el,draggable,sx:e.clientX,sy:e.clientY,moved:false,ox:e.clientX-br.left,oy:e.clientY-br.top,lr,vx:0,lx:e.clientX,rot:0,hot:null,pend:!!pend};
  el.setPointerCapture(e.pointerId);
  el.addEventListener('pointermove',onMove); el.addEventListener('pointerup',onUp); el.addEventListener('pointercancel',onUp);
}
function onMove(e){
  const d=DRAG; if(!d) return;
  if(!d.moved){ if(Math.hypot(e.clientX-d.sx,e.clientY-d.sy)<7) return; if(!d.draggable){ return; } d.moved=true; d.el.classList.add('drag'); d.el.style.zIndex=60; }
  d.vx=d.vx*.7+(e.clientX-d.lx)*.3; d.lx=e.clientX; d.rot+= (Math.max(-16,Math.min(16,d.vx*1.4))-d.rot)*.35;
  const x=e.clientX-d.lr.left-d.ox*1.0, y=e.clientY-d.lr.top-d.oy*1.0;
  d.el.style.transform=tf(x-HW*.05,y-HW*.07,1.1,d.rot);
  d.el.style.setProperty('--tx',(d.rot/16).toFixed(3)); d.el.style.setProperty('--ty',(Math.max(-1,Math.min(1,(e.clientY-d.sy)/300))).toFixed(3)); d.el.style.setProperty('--tm',Math.min(1,Math.abs(d.rot)/10+.25).toFixed(3));
  const li=laneAt(e.clientX,e.clientY), c=findCard(d.u);
  const energy=pE()-G.pq.filter(q=>q.c.u!==d.u).reduce((s,q)=>s+D(q.c).cost,0);
  let ok=false; if(li!=null&&c){ const save=G.pq; G.pq=G.pq.filter(q=>q.c.u!==d.u); ok=D(c).cost<=energy&&canPlay(G,li,'p'); G.pq=save; }
  document.querySelectorAll('#board .lane').forEach(ln=>{ const l=+ln.dataset.l; ln.classList.toggle('hot',ok&&l===li); ln.classList.toggle('can',!ok||l!==li); });
  d.hot=ok?li:null;
}
function findCard(u){ return G.pHand.find(c=>c.u===u)||G.pq.find(q=>q.c.u===u)?.c; }
function onUp(e){
  const d=DRAG; if(!d) return; DRAG=null;
  d.el.removeEventListener('pointermove',onMove); d.el.removeEventListener('pointerup',onUp); d.el.removeEventListener('pointercancel',onUp);
  document.querySelectorAll('#board .lane').forEach(ln=>ln.classList.remove('hot','can'));
  d.el.classList.remove('drag'); ['--tx','--ty','--tm'].forEach(k=>d.el.style.removeProperty(k));
  if(!d.moved){ tapCard(d.u,d.el); return; }
  const c=findCard(d.u);
  if(d.hot!=null&&c){
    const hi=G.pHand.findIndex(x=>x.u===d.u); if(hi>=0) G.pHand.splice(hi,1);
    G.pq=G.pq.filter(q=>q.c.u!==d.u); G.pq.push({c,li:d.hot});

    const li=laneAt(e.clientX,e.clientY);
    if(li!=null){ const energy=pE()-G.pq.reduce((s,q)=>s+D(q.c).cost,0); G.msg = D(c).cost>energy?L('{} costs {}. You have {} energy left.',esc(D(c).name),D(c).cost,energy):L('No room for you at {}.',LOCS[G.lanes[li].loc].n); }
  }
  bRender();
}

async function endTurn(){
  if(!G||G.busy||G.over) return;
  G.busy=true; G.armed=false;
  const plan=aiDecide(G,G.cfg.noise);
  const oPlays=plan.map(s=>{ const i=G.oHand.findIndex(c=>c.u===s.u); return {side:'o',c:G.oHand.splice(i,1)[0],li:s.li}; });
  const pPlays=G.pq.map(q=>({side:'p',c:q.c,li:q.li}));
  const pFirst=G.prio==='p';
  const seq=orderReveals(pFirst?[...pPlays,...oPlays]:[...oPlays,...pPlays]);
  // everything lands at once, face-down, then flips in reveal order
  [...pPlays,...oPlays].forEach(x=>{ x.c.flipped=false; if(x.c.sk==null) x.c.sk=++SKC; });
  G.staged=seq.slice(); G.pq=[];
  G.msg=(pFirst?L('You have priority. Your cards reveal first, in the order you played them.'):L('Your rival has priority and reveals first.'))+(oPlays.length?'':L(' Your rival holds back.'));
  bRender(); await sleep(seq.length?750:450);
  for(const st of seq){
    if(st.side==='p') G.played.add(st.c.id);
    // flip it face up where it sits
    const rec=CEL.get(st.c.u); st.c.flipped=true;
    if(rec){ rec.el.style.zIndex=12; if(!(G.fog&&st.side==='o')) rec.el.querySelector('.tci').classList.remove('down'); rec.el.classList.add('glow'); setTimeout(()=>rec.el.classList.remove('glow'),900); }
    await sleep(rec?430:0);
    G.staged=G.staged.filter(x=>x!==st);
    let line=''; const fx=[];
    reveal(G,st.side,st.c,st.li,m=>{ line=line?line+' '+m:m; },fx);
    G.msg=line?esc(line):L('{} played <b>{}</b>.',st.side==='p'?L('You'):L('Rival'),esc(D(st.c).name));
    $('#binfo').innerHTML='<span>'+G.msg+'</span>';
    await playFx(fx);
    bRender();
    await sleep(line?850:450);
    if(G.lanes.some(L=>L.p.some(c=>c.dead)||L.o.some(c=>c.dead))){ await sleep(250); G.lanes.forEach(L=>{L.p=alive(L.p);L.o=alive(L.o);}); bRender(); await sleep(250); }
  }
  { let line=''; endOfTurn(G,m=>{ line=line?line+' '+m:m; }); if(line){ G.msg=esc(line); bRender(); await sleep(1100); } }
  if(G.turn>=6) finish(); else startTurn();
}
function scoreOf(res,cfg,gear){
  const won=res.filter(x=>x.p>x.o), chips=won.reduce((s,x)=>s+x.p,0);
  let mult=won.length+(gear.includes('notebook')?won.length:0);
  const parts=[[`Power in won habitats`,chips],[`× habitats won${gear.includes('notebook')?' (Field Notebook doubles it)':''}`,mult]];
  let total=chips*mult;
  if(won.length===3&&gear.includes('panorama')){ total*=2; parts.push(['× Panorama',2]); }
  if(cfg.boss){ total*=2; parts.push(['× boss',2]); }
  const a=SV.run.ante; total*=a; parts.push([`× stage ${a}`,a]);
  return {total,parts};
}
function finish(forfeit){
  G.over=true; G.busy=false;
  document.querySelectorAll('#layer .tc[data-owner="o"] .tci.down').forEach(t=>t.classList.remove('down'));
  bRender();
  const r=SV.run, cfg=G.cfg, res=[0,1,2].map(i=>({loc:G.lanes[i].loc,p:total(G,i,'p'),o:total(G,i,'o')}));
  const pw=res.filter(x=>x.p>x.o).length, ow=res.filter(x=>x.o>x.p).length, sp=res.reduce((s,x)=>s+x.p,0), so=res.reduce((s,x)=>s+x.o,0);
  const out=forfeit?'loss':pw>ow?'win':ow>pw?'loss':sp>so?'win':so>sp?'loss':'draw';
  r.battles++;
  let coins=0, interest=0, score={total:0,parts:[]};
  if(out==='win'){ r.wins++; score=scoreOf(res,cfg,r.gear); interest=interestOf(r.coins); coins=3+pw+(cfg.boss?4:0)+(r.gear.includes('grant')?2:0); }
  else coins=1;
  r.coins+=coins+interest; r.score+=score.total;
  // card experience (persists across runs)
  const ups=[], prog=[], look=c=>({xp:c.xp,lv:levelOf(c),f:c.f||0,fn:c.fn||'none',bc:c.bc||'default',v:c.v||'field'});
  for(const id of G.played){ const c=SV.cards[id]; if(!c) continue; const b=look(c); c.plays=(c.plays||0)+1; if(out==='win') c.wins=(c.wins||0)+1;
    const l=gainXP(id,1+(out==='win'?1:0)+(cfg.boss?1:0)); if(l){ ups.push([id,l]); for(let k=b.lv+1;k<=l;k++) autoUpgrade(c,k); }
    prog.push({id,b,a:look(c),l}); }
  prog.sort((x,y)=>(y.l?1:0)-(x.l?1:0));
  let next='';
  if(out==='loss'){ r.lives-=1; }
  if(r.lives<=0) next='over';
  else if(out==='win'&&cfg.boss){ if(cfg.final&&!r.endless) next='victory'; else next='advance'; }
  else if(cfg.boss) next='retry';
  else next='advance';
  r.pending=next; save();
  const title={win:'Victory',loss:'Defeat',draw:'Stalemate'}[out];
  const div=document.createElement('div'); div.className='result';
  div.innerHTML=`<div class="card-s"><div class="kicker">${esc(cfg.name)} · ${esc(cfg.rival)}</div><h2 style="margin-top:6px">${title}</h2>
    <p class="small" style="margin:6px 0 0">${forfeit?L('You retreated.'):L('You took {} habitat{}, your rival took {}.',pw,pw===1?'':'s',ow)}${out==='loss'?L(' You lose a life ({} left).',Math.max(0,r.lives)):''}${next==='retry'?L(' The boss is still waiting.'):''}</p>
    <div class="lres">${res.map(x=>`<div class="${x.p>x.o?'w':''}">${LOCS[x.loc].n}<b>${x.p}–${x.o}</b></div>`).join('')}</div>
    ${out==='win'?`<table class="brk" style="margin-top:12px">${score.parts.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('')}<tr class="tot"><td>Score</td><td>+${score.total.toLocaleString(NUMLOC)}</td></tr></table>`:''}
    <p style="margin:12px 0 0;font-weight:600">+${coins} coins${interest?` · +${interest} interest`:''}</p>
    ${prog.length?`<div class="prog">${prog.map((p,i)=>`<div class="pg" data-i="${i}" data-up="${esc(L('Level up!'))}"><div class="pgc">${cardHTML(p.id,p.b)}</div><div class="pgb"><i style="width:${xpPct(p.b)}%"></i></div><div class="pgl"><span>${L('Lv {}',p.b.lv)}</span><em>+${p.a.xp-p.b.xp} XP</em></div></div>`).join('')}</div>`:''}
    <div class="ups" id="pgups" hidden></div>
    <div class="row" style="justify-content:center;margin-top:16px"><button class="btn ghost" data-act="peekboard">${L('See board')}</button><button class="btn amber" data-act="leave">${next==='over'?'See results':'Continue'}</button></div></div>`;
  $('#battle').appendChild(div); G.result=div;

    case 'inspect': zoom(t.querySelector('.cardbox'),t.dataset.id,{kind:'col'}); break;
    case 'peek': zoom(t.querySelector('.cardbox'),t.dataset.id,{kind:'col'}); break;
    case 'dcard': { const id=t.dataset.id; const extra=`<div class="card-s row between"><div><h3>In your run deck</h3><p class="small" style="margin:2px 0 0">Release it to make your deck smaller and more consistent.</p></div><button class="btn sm ghost" data-act="release" data-id="${id}" ${r.coins<2||r.deck.length<=6?'disabled':''}>Release · 2</button></div>`; zoom(t.querySelector('.cardbox'),id,{kind:'col',extra,info:infoCol(id,extra)}); break; }
    case 'release': { const id=t.dataset.id; if(r.deck.length<=6){ toast('Your run deck needs at least 6 cards.'); break; } r.coins-=2; r.deck.splice(r.deck.indexOf(id),1); save(); zclose(); render(); toast(`${esc(DB[id].name)} released.`); break; }
    case 'cbord': { const c=SV.cards[t.dataset.id]; c.f=+t.dataset.k; save(); render(); zoomRefresh(); break; }
    case 'cfin': { const c=SV.cards[t.dataset.id]; c.fn=t.dataset.k; save(); render(); zoomRefresh(); break; }
    case 'ccol': { const c=SV.cards[t.dataset.id]; c.bc=t.dataset.k; save(); render(); zoomRefresh(); break; }
    case 'cvar': { const c=SV.cards[t.dataset.id]; c.v=t.dataset.v; save(); render(); zoomRefresh(); break; }
    case 'studio': openStudio(t.querySelector('.cardbox'),t.dataset.id); break;
    case 'sv': ST.v=t.dataset.v; zoomRefresh(); break;
    case 'sf': ST.f=+t.dataset.f; zoomRefresh(); break;
    case 'sfn': ST.fn=t.dataset.k; zoomRefresh(); break;
    case 'artclear': clearLayer(t.dataset.id,ST.v,t.dataset.layer); break;
    case 'export': exportSheet(); break;
    case 'zclose': zclose(); break;
    case 'newrun': zclose(); newRun(); break;
    case 'fight': startBattle(); break;
    case 'buycard': { const o=r.shop.cards[+t.dataset.i]; if(o.sold||r.coins<o.price) break; r.coins-=o.price; o.sold=true; r.deck.push(o.id); save(); render(); toast(`${esc(DB[o.id].name)} joins your run deck.`); break; }
    case 'buypack': buyPack(+t.dataset.i); break;
    case 'buygear': { const g=r.shop.gear[+t.dataset.i]; if(g.sold||r.coins<g.price||r.gear.length>=5) break; r.coins-=g.price; g.sold=true; r.gear.push(g.k); save(); render(); break; }
    case 'takegear': { if(r.gear.length<5) r.gear.push(t.dataset.k); save(); zclose(); render(); break; }
    case 'sellgear': { const i=+t.dataset.i; if(!arm('sell'+i)) break; const k=r.gear[i]; r.coins+=Math.floor(GEARK[k].p/2); r.gear.splice(i,1); save(); render(); break; }
    case 'reroll': { const c=rerollCost(); if(r.coins<c) break; r.coins-=c; r.shop.rerolls++; r.shop.cards=rollShopCards(r); r.shop.gear=rollGear(r,2); save(); render(); break; }
    case 'abandon': if(arm('abandon')) endRun(false); break;
    case 'endless': r.endless=true; r.node=0; r.ante++; if(r.ante>r.biomes.length){ r.biomes.push(shuffle(Object.keys(BIO))[0]); r.bosses.push(BOSSES[Math.random()*BOSSES.length|0].k); } makeShop(false); save(); zclose(); render(); break;
    case 'cashout': zclose(); endRun(true); break;
    case 'discoverall': SET.forEach(d=>{ if(!known(d.id)) SV.cards[d.id]=newCard(); }); save(); render(); toast('Every animal is discovered.'); break;
    case 'xpall': for(const id in SV.cards) gainXP(id,20); save(); render(); toast('+20 XP on every discovered card.'); break;
    case 'pflip': pselect(+t.dataset.k); break;
    case 'ptake': if(PK&&PK.sel!=null) pflip(PK.sel); break;
    case 'pskip': closePack(); break;
    case 'end': endTurn(); break;
    case 'retreat': if(!G||G.over||G.busy) break; if(G.armed){ G.armed=false; finish(true); } else { G.armed=true; bRender(); setTimeout(()=>{ if(G&&G.armed){ G.armed=false; bRender(); } },3000); } break;
    case 'leave': leave(); break;
    case 'peekboard': if(G&&G.result){ G.result.classList.add('peek'); G.peek=true; bRender(); } break;
    case 'backres': if(G&&G.result){ G.result.classList.remove('peek'); G.peek=false; bRender(); } break;
    case 'loc': { const L=LOCS[G.lanes[+t.dataset.l].loc]; showSheet(`<div class="card-s"><div class="kicker">${PT?'Habitat '+PT_BIO_IN[L.b]:BIO[L.b].n+' habitat'}</div><h2 style="margin-top:4px">${L.n}</h2><p style="margin:8px 0 0">${L.t}</p><p class="small">${PT?'Animais '+PT_BIO_IN[L.b]:BIO[L.b].n+' animals'} get +${G.gear.includes('fieldguide')?3:2} here as natives. Each side holds ${Math.min(L.slots||4,G.narrow?3:4)} cards.</p></div><button class="btn ghost" data-act="zclose">Close</button>`); break; }
  }
});
document.addEventListener('change',e=>{ const t=e.target; if(t.dataset.up) onUpload(t); else if(t.dataset.bulk) onBulk(t); if(t.type==='file') t.value=''; });
addEventListener('resize',()=>{ if(G){ bLayout(); bRender(); } });
render();
initCaps();
cloudStart();

</script>

/* Offline: cache the game and its pictures on the phone */
if('serviceWorker' in navigator){ addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
